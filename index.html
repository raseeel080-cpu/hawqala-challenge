<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داش بورد الحوقلة</title>
    <style>
        :root {
            --primary: #2d6a4f;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text: #1b4332;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }
        .dashboard {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: var(--primary);
            font-size: 22px;
            margin-bottom: 5px;
        }
        p.subtitle {
            text-align: center;
            color: #52b788;
            font-size: 14px;
            margin-top: 0;
            margin-bottom: 25px;
        }
        .counter-card {
            background: #d8f3dc;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            margin-bottom: 25px;
        }
        .counter-card h3 {
            margin: 0 0 10px 0;
            color: var(--primary);
        }
        .count-display {
            font-size: 40px;
            font-weight: bold;
            color: var(--primary);
            margin: 15px 0;
        }
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
        }
        .btn:active {
            background: #1b4332;
        }
        .btn-share {
            background: #40916c;
            margin-top: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #d8f3dc;
            padding: 12px;
            text-align: center;
        }
        th {
            background: var(--primary);
            color: white;
            font-weight: normal;
        }
        /* تلوين عمود سارا باللون الأصفر الهادئ */
        .sara-column {
            background-color: #fff9c4 !important; 
        }
        th.sara-column {
            background-color: #fbc02d !important;
            color: #333;
            font-weight: bold;
        }
        tr:nth-child(even) {
            background-color: #f9fbf9;
        }
        .checkbox-custom {
            width: 24px;
            height: 24px;
            cursor: pointer;
            accent-color: var(--primary);
        }
        .notification-setup {
            text-align: center;
            font-size: 12px;
            color: #777;
            margin-top: 20px;
        }
        .notification-setup button {
            background: none;
            border: 1px underline;
            color: var(--primary);
            cursor: pointer;
            padding: 5px;
        }
    </style>
</head>
<body>

<div class="dashboard">
    <h1>تحدي 40 يوم حوقلة</h1>
    <p class="subtitle">لا حول ولا قوة إلا بالله</p>

    <!-- عداد اليوم -->
    <div class="counter-card">
        <h3>ورد اليوم (أصيلة)</h3>
        <div class="count-display" id="dailyCounter">0 / 100</div>
        <button class="btn" onclick="incrementCounter()">+ حوقلة</button>
        <button class="btn" style="background: #95d5b2; color: #1b4332;" onclick="resetCounter()">تصفير العداد</button>
    </div>

    <!-- جدول المتابعة -->
    <table>
        <thead>
            <tr>
                <th>اليوم</th>
                <th>أصيلة</th>
                <th class="sara-column">سارا</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- يتم توليد الصفوف عبر الجافاسكربت -->
        </tbody>
    </table>

    <!-- زر المشاركة -->
    <button class="btn btn-share" onclick="shareViaEmail()">إرسال التحديث لسارا عبر البريد ✉️</button>

    <div class="notification-setup">
        <button onclick="requestNotificationPermission()">تفعيل التنبيه اليومي في المتصفح</button>
    </div>
</div>

<script>
    const totalDays = 40;
    
    let currentCount = parseInt(localStorage.getItem('hawqala_count')) || 0;
    let daysData = JSON.parse(localStorage.getItem('hawqala_data')) || Array.from({length: totalDays}, () => ({aseela: false, sara: false}));

    const countDisplay = document.getElementById('dailyCounter');
    const tableBody = document.getElementById('tableBody');

    function updateCounterUI() {
        countDisplay.innerText = `${currentCount} / 100`;
    }

    function incrementCounter() {
        if (currentCount < 100) {
            currentCount++;
            localStorage.setItem('hawqala_count', currentCount);
            updateCounterUI();
            
            if (currentCount === 100) {
                alert("ما شاء الله! اكتمل ورد اليوم (100 حوقلة). يمكنك الآن وضع علامة (صح) في جدول اليوم.");
                currentCount = 0; 
                localStorage.setItem('hawqala_count', currentCount);
                updateCounterUI();
            }
        }
    }

    function resetCounter() {
        currentCount = 0;
        localStorage.setItem('hawqala_count', currentCount);
        updateCounterUI();
    }

    function saveTableData(dayIndex, person, isChecked) {
        daysData[dayIndex][person] = isChecked;
        localStorage.setItem('hawqala_data', JSON.stringify(daysData));
    }

    function renderTable() {
        tableBody.innerHTML = '';
        for (let i = 0; i < totalDays; i++) {
            const tr = document.createElement('tr');
            
            const tdDay = document.createElement('td');
            tdDay.innerText = i + 1;
            
            const tdAseela = document.createElement('td');
            const checkAseela = document.createElement('input');
            checkAseela.type = 'checkbox';
            checkAseela.className = 'checkbox-custom';
            checkAseela.checked = daysData[i].aseela;
            checkAseela.onchange = (e) => saveTableData(i, 'aseela', e.target.checked);
            tdAseela.appendChild(checkAseela);

            const tdSara = document.createElement('td');
            tdSara.className = 'sara-column'; // تفعيل اللون الأصفر هنا
            const checkSara = document.createElement('input');
            checkSara.type = 'checkbox';
            checkSara.className = 'checkbox-custom';
            checkSara.checked = daysData[i].sara;
            checkSara.onchange = (e) => saveTableData(i, 'sara', e.target.checked);
            tdSara.appendChild(checkSara);

            tr.appendChild(tdDay);
            tr.appendChild(tdAseela);
            tr.appendChild(tdSara);
            
            tableBody.appendChild(tr);
        }
    }

    function shareViaEmail() {
        const aseelaCompleted = daysData.filter(d => d.aseela).length;
        const saraCompleted = daysData.filter(d => d.sara).length;
        
        const subject = encodeURIComponent("تحديث تحدي الحوقلة (40 يوم)");
        const body = encodeURIComponent(
            `أهلاً سارا،\n\n` +
            `هذا تحديثنا لتحدي الحوقلة:\n` +
            `- الأيام المنجزة (أصيلة): ${aseelaCompleted} يوم.\n` +
            `- الأيام المنجزة (سارا): ${saraCompleted} يوم.\n\n` +
            `بالتوفيق لنا! لا حول ولا قوة إلا بالله.`
        );
        
        window.location.href = `mailto:?subject=${subject}&body=${body}`;
    }

    function requestNotificationPermission() {
        if (!("Notification" in window)) {
            alert("متصفحك لا يدعم التنبيهات.");
        } else if (Notification.permission === "granted") {
            scheduleDailyNotification();
            alert("التنبيهات مفعلة بالفعل!");
        } else if (Notification.permission !== "denied") {
            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    scheduleDailyNotification();
                    alert("تم تفعيل التنبيهات بنجاح.");
                }
            });
        }
    }

    function scheduleDailyNotification() {
        new Notification("تحدي الحوقلة", {
            body: "تذكير: لا تنسي ورد الحوقلة اليوم (لا حول ولا قوة إلا بالله).",
            icon: "https://cdn-icons-png.flaticon.com/512/3389/3389081.png"
        });
    }

    updateCounterUI();
    renderTable();

</script>
</body>
</html>
